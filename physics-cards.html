<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Физика — Карточки</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Cinzel:wght@400;600;700&family=Cormorant+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0806;
  --surface: #130f09;
  --card-bg: #1a1510;
  --card-back: #16120d;
  --blue: #c8a050;
  --blue-light: #e8c878;
  --blue-dim: #8a6c30;
  --accent: #1a3a6a;
  --text: #e0d0b0;
  --text-dim: #806840;
  --text-muted: #504030;
  --border: #2a2010;
  --border-blue: rgba(200,160,80,0.25);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', Georgia, serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 30%, rgba(122,26,26,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 85% 70%, rgba(200,160,80,0.07) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
.container { position: relative; z-index: 1; }
header {
  text-align: center;
  padding: 3rem 2rem 2rem;
}
.header-ornament {
  display: flex; align-items: center; justify-content: center;
  gap: 1.5rem; margin-bottom: 1.2rem;
  color: var(--blue-dim); font-size: 1rem; letter-spacing: 0.3em;
}
.header-ornament::before, .header-ornament::after {
  content: ''; flex: 1; max-width: 120px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--blue-dim));
}
.header-ornament::after { background: linear-gradient(90deg, var(--blue-dim), transparent); }
h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.4rem, 4vw, 2.2rem);
  font-weight: 600;
  color: var(--blue-light);
  letter-spacing: 0.12em;
  text-shadow: 0 0 40px rgba(200,160,80,0.3);
  margin-bottom: 0.6rem;
}
.subtitle { color: var(--text-dim); font-size: 1rem; font-style: italic; }
.header-rule {
  display: flex; align-items: center; justify-content: center;
  gap: 1rem; margin-top: 1.5rem;
}
.header-rule::before, .header-rule::after {
  content: ''; flex: 1; max-width: 200px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-blue));
}
.header-rule-center { width: 6px; height: 6px; background: var(--blue); transform: rotate(45deg); flex-shrink: 0; }
.tabs {
  display: flex; justify-content: center; gap: 0;
  padding: 0 2rem 1.5rem; border-bottom: 1px solid var(--border);
}
.tab-btn {
  background: none; border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'Cinzel', serif; font-size: 0.78rem; letter-spacing: 0.15em;
  padding: 0.7rem 2rem; cursor: pointer; transition: all 0.3s;
}
.tab-btn:first-child { border-radius: 3px 0 0 3px; }
.tab-btn:last-child { border-radius: 0 3px 3px 0; border-left: none; }
.tab-btn:hover { color: var(--blue); border-color: var(--border-blue); }
.tab-btn.active {
  background: linear-gradient(135deg, var(--blue-dim), var(--blue));
  border-color: var(--blue); color: var(--bg); font-weight: 600;
  box-shadow: 0 0 20px rgba(200,160,80,0.2);
}
.due-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; background: #7a1a1a;
  color: var(--blue-light); font-size: 0.65rem; padding: 0 5px;
  border-radius: 10px; margin-left: 8px;
}
.view { display: none; padding: 2rem 1rem 4rem; max-width: 780px; margin: 0 auto; }
.view.active { display: block; }
.stats-bar { display: flex; justify-content: center; gap: 3rem; margin-bottom: 2rem; }
.stat { text-align: center; }
.stat strong {
  display: block; font-family: 'Cinzel', serif; font-size: 1.8rem;
  color: var(--blue); line-height: 1; margin-bottom: 0.2rem;
  text-shadow: 0 0 20px rgba(200,160,80,0.3);
}
.stat span { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }
.filter-row { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1.5rem; }
.filter-tag {
  font-family: 'Cormorant Garamond', serif; font-size: 0.9rem;
  padding: 0.3rem 1rem; border-radius: 20px;
  border: 1px solid var(--border); background: none;
  color: #907050; cursor: pointer; transition: all 0.2s;
}
.filter-tag:hover { border-color: var(--border-blue); color: var(--blue-dim); }
.filter-tag.active { border-color: var(--blue); color: var(--blue); background: rgba(74,127,193,0.08); }
.progress-bar {
  height: 2px; background: var(--border);
  margin-bottom: 2rem; max-width: 640px;
  margin-left: auto; margin-right: auto; overflow: visible;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #7a1a1a, var(--blue));
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.progress-fill::after {
  content: ''; position: absolute; right: -3px; top: -3px;
  width: 8px; height: 8px; background: var(--blue);
  border-radius: 50%; box-shadow: 0 0 8px rgba(200,160,80,0.8);
}
.card-container {
  perspective: 1400px; margin: 0 auto 1.5rem;
  max-width: 640px; height: 300px; cursor: pointer;
}
.card-inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.65s cubic-bezier(.4,0,.2,1);
}
.card-inner.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 6px; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2.5rem 2.5rem 3.5rem; text-align: center; overflow: hidden;
}
.card-face::before {
  content: ''; position: absolute; inset: 10px;
  border: 1px solid rgba(200,160,80,0.12); border-radius: 3px; pointer-events: none;
}
.corner { position: absolute; width: 20px; height: 20px; border-color: var(--blue-dim); border-style: solid; opacity: 0.4; }
.corner-tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
.corner-tr { top: 8px; right: 8px; border-width: 1px 1px 0 0; }
.corner-bl { bottom: 8px; left: 8px; border-width: 0 0 1px 1px; }
.corner-br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }
.card-back { transform: rotateY(180deg); background: var(--card-back); }
.card-label {
  font-family: 'Cinzel', serif; font-size: 0.6rem;
  letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--blue-dim); margin-bottom: 1rem;
}
.card-text {
  font-size: clamp(0.9rem, 2.2vw, 1.15rem); line-height: 1.7;
  color: var(--text); overflow-y: auto; max-height: 180px; font-weight: 300;
}
.card-back .card-text { color: var(--blue-light); font-style: italic; font-weight: 400; }
.card-hint { position: absolute; bottom: 1.2rem; font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.08em; }
.card-num { position: absolute; top: 1.1rem; right: 1.3rem; font-family: 'Cormorant SC', serif; font-size: 0.75rem; color: var(--text-muted); }
.card-cat {
  position: absolute; top: 1.1rem; left: 1.3rem;
  font-size: 0.68rem; color: var(--blue); opacity: 0.8;
  background: rgba(74,127,193,0.08); padding: 2px 10px;
  border-radius: 12px; border: 1px solid rgba(74,127,193,0.15); letter-spacing: 0.05em;
}
.btn-zone { position: relative; height: 56px; max-width: 640px; margin: 0 auto 1.5rem; }
.card-controls {
  display: flex; gap: 0.8rem; justify-content: center;
  flex-wrap: wrap; position: absolute; inset: 0; margin: 0;
}
.btn {
  font-family: 'Cormorant Garamond', serif; font-size: 1rem;
  padding: 0.6rem 1.8rem; border-radius: 3px;
  cursor: pointer; border: 1px solid; transition: all 0.25s; letter-spacing: 0.06em;
}
.btn-blue {
  background: linear-gradient(135deg, var(--blue-dim), var(--blue));
  border-color: var(--blue); color: var(--bg); font-weight: 600;
  box-shadow: 0 2px 12px rgba(200,160,80,0.2);
}
.btn-blue:hover { background: linear-gradient(135deg, var(--blue), var(--blue-light)); box-shadow: 0 4px 20px rgba(200,160,80,0.35); transform: translateY(-1px); }
.btn-outline { background: none; border-color: var(--border); color: var(--text-muted); }
.btn-outline:hover { border-color: var(--border-blue); color: var(--blue-dim); }
.btn-green { background: rgba(30,70,50,0.3); border-color: #2d5a40; color: #6dbf8a; }
.btn-green:hover { background: rgba(30,70,50,0.5); }
.btn-red { background: rgba(70,20,20,0.3); border-color: #6a2020; color: #c05050; }
.btn-red:hover { background: rgba(70,20,20,0.5); }
/* QUIZ */
.quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
.q-counter { font-family: 'Cormorant SC', serif; font-size: 0.9rem; color: var(--text-dim); letter-spacing: 0.08em; }
.quiz-score { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--blue); text-shadow: 0 0 10px rgba(200,160,80,0.3); }
.quiz-question {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 2rem 1.8rem 1.8rem; margin-bottom: 1.2rem;
  font-size: clamp(0.95rem, 2.3vw, 1.15rem); line-height: 1.7; font-weight: 300; position: relative;
}
.quiz-question::before {
  content: ''; position: absolute; inset: 8px;
  border: 1px solid rgba(200,160,80,0.08); border-radius: 2px; pointer-events: none;
}
.q-num-badge {
  display: inline-block;
  background: linear-gradient(135deg, var(--blue-dim), var(--blue));
  color: var(--bg); font-family: 'Cinzel', serif; font-size: 0.6rem; font-weight: 600;
  padding: 2px 10px; border-radius: 12px; letter-spacing: 0.12em; margin-bottom: 0.8rem;
}
.options { display: flex; flex-direction: column; gap: 0.6rem; }
.option-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 1rem;
  padding: 0.85rem 1.2rem; border-radius: 4px; cursor: pointer;
  text-align: left; transition: all 0.2s;
  display: flex; gap: 0.9rem; align-items: flex-start; line-height: 1.5; font-weight: 300;
}
.option-btn:hover:not(:disabled) { border-color: var(--border-blue); background: rgba(74,127,193,0.06); color: var(--blue-light); }
.option-btn.correct { border-color: #4a9a68 !important; background: rgba(30,80,50,0.25) !important; color: #7ed4a0 !important; }
.option-btn.wrong { border-color: #9a3030 !important; background: rgba(120,30,30,0.25) !important; color: #d48080 !important; }
.option-btn:disabled { cursor: default; }
.opt-letter {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 24px; border: 1px solid currentColor;
  border-radius: 50%; font-size: 0.7rem; font-weight: 600;
  flex-shrink: 0; margin-top: 1px; font-family: 'Cinzel', serif;
}
.feedback-msg {
  padding: 0.9rem 1.2rem; border-radius: 4px; font-size: 0.95rem;
  margin-top: 0.8rem; display: none; font-style: italic; line-height: 1.6;
}
.feedback-msg.show { display: block; }
.feedback-msg.ok { background: rgba(30,80,50,0.2); border: 1px solid #2d5a40; color: #7ed4a0; }
.feedback-msg.fail { background: rgba(120,30,30,0.2); border: 1px solid #6a2020; color: #d48080; }
.auto-timer-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 0.8rem; opacity: 0; transition: opacity 0.3s; }
.auto-timer-bar.visible { opacity: 1; }
.auto-timer-fill { height: 100%; background: linear-gradient(90deg, #7a1a1a, var(--blue)); border-radius: 2px; width: 100%; transform-origin: left; transform: scaleX(1); transition: transform linear; }
.quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.2rem; gap: 0.8rem; }
.quiz-setup { text-align: center; margin-bottom: 1.5rem; }
.quiz-setup-label { font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.7rem; }
.size-btns { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; }
.size-btn {
  font-family: 'Cormorant Garamond', serif; font-size: 0.9rem;
  padding: 0.3rem 1rem; border: 1px solid var(--border);
  background: none; color: var(--text-muted); cursor: pointer;
  border-radius: 20px; transition: all 0.2s;
}
.size-btn:hover { border-color: var(--border-blue); color: var(--blue-dim); }
.size-btn.active { border-color: var(--blue); color: var(--blue); background: rgba(74,127,193,0.08); }
.results-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 4rem 2rem; text-align: center; position: relative; overflow: hidden;
}
.results-card::before { content: ''; position: absolute; inset: 12px; border: 1px solid rgba(200,160,80,0.1); border-radius: 3px; }
.results-ornament { font-size: 2rem; color: var(--blue-dim); letter-spacing: 0.5em; margin-bottom: 1rem; }
.results-score { font-family: 'Cinzel', serif; font-size: 4.5rem; color: var(--blue); line-height: 1; text-shadow: 0 0 30px rgba(200,160,80,0.4); }
.results-denom { font-family: 'Cormorant SC', serif; font-size: 1.1rem; color: var(--text-dim); letter-spacing: 0.1em; margin: 0.3rem 0; }
.results-label { color: var(--text-dim); font-style: italic; font-size: 1.1rem; margin: 0.5rem 0 2rem; }
.results-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; max-width: 280px; margin: 0 auto 2.5rem; }
.results-fill { height: 100%; background: linear-gradient(90deg, #7a1a1a, var(--blue)); border-radius: 2px; transition: width 1.2s cubic-bezier(.4,0,.2,1); }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--border); }
::-webkit-scrollbar-thumb { background: var(--blue-dim); border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
<header>
  <div class="header-ornament">⚛</div>
  <h1>Физика</h1>
  <p class="subtitle">45 вопросов обязательного минимума · Карточки · Квиз</p>
  <div class="header-rule"><div class="header-rule-center"></div></div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('cards')">КАРТОЧКИ</button>
  <button class="tab-btn" onclick="switchTab('quiz')">КВИЗ <span class="due-badge" id="quiz-badge">20</span></button>
</div>

<!-- CARDS -->
<div class="view active" id="view-cards">
  <div class="stats-bar">
    <div class="stat"><strong id="stat-total">0</strong><span>всего</span></div>
    <div class="stat"><strong id="stat-known">0</strong><span>знаю</span></div>
    <div class="stat"><strong id="stat-due">0</strong><span>не знаю</span></div>
  </div>
  <div class="filter-row" id="filter-row"></div>
  <div class="progress-bar" style="margin-bottom:1.5rem">
    <div class="progress-fill" id="card-progress" style="width:0%"></div>
  </div>
  <div class="card-container" onclick="flipCard()">
    <div class="card-inner" id="card-inner">
      <div class="card-face card-front">
        <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div><div class="corner corner-br"></div>
        <span class="card-num" id="card-num">1 / 45</span>
        <span class="card-cat" id="card-cat"></span>
        <div class="card-label">Вопрос</div>
        <div class="card-text" id="card-q">Загрузка…</div>
        <span class="card-hint">нажмите, чтобы увидеть ответ</span>
      </div>
      <div class="card-face card-back">
        <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div><div class="corner corner-br"></div>
        <span class="card-num" id="card-num-b">1 / 45</span>
        <div class="card-label">Ответ</div>
        <div class="card-text" id="card-a">—</div>
        <span class="card-hint">оцените себя ниже</span>
      </div>
    </div>
  </div>
  <div class="btn-zone">
    <div class="card-controls" id="rate-btns" style="display:none">
      <button class="btn btn-red" onclick="rateCard(false)">✗ &nbsp;Не знал</button>
      <button class="btn btn-green" onclick="rateCard(true)">✓ &nbsp;Знал</button>
    </div>
    <div class="card-controls" id="flip-btns">
      <button class="btn btn-outline" onclick="prevCard()">← Назад</button>
      <button class="btn btn-blue" onclick="flipCard()">Перевернуть</button>
      <button class="btn btn-outline" onclick="nextCard()">Вперёд →</button>
    </div>
  </div>
</div>

<!-- QUIZ -->
<div class="view" id="view-quiz">
  <div class="quiz-setup">
    <div class="quiz-setup-label">Количество вопросов</div>
    <div class="size-btns">
      <button class="size-btn" onclick="setQuizSize(10)" id="sz-10">10</button>
      <button class="size-btn active" onclick="setQuizSize(20)" id="sz-20">20</button>
      <button class="size-btn" onclick="setQuizSize(45)" id="sz-45">Все 45</button>
    </div>
  </div>

  <div id="quiz-area" style="display:none">
    <div class="quiz-header">
      <span class="q-counter" id="q-counter">Вопрос 1 / 20</span>
      <div style="display:flex;align-items:center;gap:1rem;">
        <span class="quiz-score" id="q-score">✦ 0</span>
        <button class="btn btn-outline" onclick="resetQuiz()" style="padding:0.3rem 0.9rem;font-size:0.8rem;color:var(--text-muted)">✕ Сброс</button>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="quiz-progress" style="width:0%"></div></div>
    <div class="quiz-question" id="q-block">
      <div class="q-num-badge" id="q-num-badge">01</div>
      <div id="q-text"></div>
    </div>
    <div class="options" id="q-options"></div>
    <div class="feedback-msg" id="q-feedback"></div>
    <div class="auto-timer-bar" id="auto-timer-bar"><div class="auto-timer-fill" id="auto-timer-fill"></div></div>
    <div class="quiz-nav">
      <button class="btn btn-outline" id="prev-btn" onclick="prevQuestion()" style="padding:0.5rem 1.2rem;font-size:0.9rem;display:none">← Назад</button>
      <span id="q-timer-label" style="font-size:0.85rem;color:var(--text-muted);font-style:italic;flex:1;text-align:center;"></span>
      <button class="btn btn-outline" id="next-btn" onclick="skipToNext()" style="display:none;padding:0.5rem 1.2rem;font-size:0.9rem">Пропустить →</button>
    </div>
  </div>

  <div id="quiz-start" style="text-align:center;padding:3rem 0">
    <div style="color:var(--blue-dim);font-size:3rem;margin-bottom:1.5rem">⚛</div>
    <button class="btn btn-blue" onclick="startQuiz()" style="font-size:1.1rem;padding:0.8rem 2.5rem">Начать квиз</button>
  </div>

  <div id="quiz-results" style="display:none">
    <div class="results-card">
      <div class="results-ornament">✦ ✦ ✦</div>
      <div class="results-score" id="res-score">0</div>
      <div class="results-denom" id="res-denom">из 20</div>
      <div class="results-label" id="res-label">Результат</div>
      <div class="results-bar"><div class="results-fill" id="res-fill" style="width:0%"></div></div>
      <div style="display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-outline" onclick="resetQuiz()">Сбросить</button>
        <button class="btn btn-blue" onclick="startQuiz()">Ещё раз →</button>
      </div>
    </div>
  </div>
</div>
</div>

<script>
const ALL_CARDS = [
  {q:"Что такое электрическое поле? Укажите основную силовую характеристику электрического поля", a:"Электрическое поле — вид материи, существующий вокруг заряженных тел и действующий на другие заряды. Основная силовая характеристика — напряжённость E = F/q (сила, действующая на единичный положительный заряд).", cat:"Электричество"},
  {q:"Сформулируйте закон сохранения электрического заряда. Объясните, что значит «замкнутая система»", a:"В замкнутой системе алгебраическая сумма электрических зарядов остаётся неизменной. Замкнутая система — система, в которую не входят и из которой не выходят заряженные частицы.", cat:"Электричество"},
  {q:"Сформулируйте принцип суперпозиции электрических полей", a:"Напряжённость поля, создаваемого системой зарядов, равна векторной сумме напряжённостей полей каждого заряда в отдельности: E = E₁ + E₂ + … + Eₙ.", cat:"Электричество"},
  {q:"Что такое конденсатор?", a:"Конденсатор — система двух проводников (обкладок), разделённых диэлектриком, способная накапливать электрический заряд. Характеристика — электроёмкость C = Q/U.", cat:"Электричество"},
  {q:"Что такое электрический ток? Что значит «постоянный ток»?", a:"Электрический ток — упорядоченное движение заряженных частиц. Постоянный ток — ток, не изменяющийся по величине и направлению со временем.", cat:"Электричество"},
  {q:"От каких физических величин зависит сопротивление проводника?", a:"Сопротивление R = ρl/S, где ρ — удельное сопротивление материала, l — длина проводника, S — площадь поперечного сечения. Также зависит от температуры.", cat:"Электричество"},
  {q:"Сформулируйте закон Ома для участка цепи и закон Ома для замкнутой (полной) цепи", a:"Для участка: I = U/R. Для полной цепи: I = ε/(R + r), где ε — ЭДС источника, r — внутреннее сопротивление, R — внешнее сопротивление.", cat:"Электричество"},
  {q:"Что такое ЭДС? Объясните, что значит «сторонние силы»", a:"ЭДС (электродвижущая сила) — работа сторонних сил по перемещению единичного положительного заряда по всей цепи: ε = A/q. Сторонние силы — силы неэлектрической природы (химические, магнитные и др.), совершающие работу внутри источника.", cat:"Электричество"},
  {q:"Что такое магнитное поле? Укажите основную силовую характеристику магнитного поля", a:"Магнитное поле — вид материи, возникающий вокруг движущихся зарядов и токов, действующий на движущиеся заряды и токи. Основная силовая характеристика — магнитная индукция B (вектор).", cat:"Магнетизм"},
  {q:"Сформулируйте правило определения направления силы Ампера и силы Лоренца", a:"Сила Ампера: правило левой руки — четыре пальца направлены по току, линии поля входят в ладонь, большой палец — направление силы. Сила Лоренца: то же правило, но пальцы — по скорости заряда (для отрицательного заряда — в обратную сторону).", cat:"Магнетизм"},
  {q:"Дайте определение явлению электромагнитной индукции", a:"Электромагнитная индукция — явление возникновения ЭДС (и тока) в проводящем контуре при изменении магнитного потока, пронизывающего этот контур. ЭДС индукции: ε = −ΔΦ/Δt.", cat:"Магнетизм"},
  {q:"Что такое трансформатор?", a:"Трансформатор — устройство для изменения напряжения переменного тока, основанное на явлении электромагнитной индукции. Состоит из сердечника и двух обмоток. U₁/U₂ = n₁/n₂, где n — число витков.", cat:"Магнетизм"},
  {q:"Дайте определение явлению самоиндукции", a:"Самоиндукция — явление возникновения ЭДС индукции в проводнике (катушке) вследствие изменения силы тока в нём самом. ЭДС самоиндукции: ε = −L·ΔI/Δt, где L — индуктивность катушки.", cat:"Магнетизм"},
  {q:"Что такое механические колебания. Объясните, что значит «свободные» и «вынужденные»", a:"Механические колебания — периодически повторяющиеся движения тела около положения равновесия. Свободные — происходят без внешних периодических воздействий за счёт начального запаса энергии. Вынужденные — происходят под действием внешней периодической силы.", cat:"Колебания"},
  {q:"Дайте определения периоду, частоте, амплитуде колебаний", a:"Период T — время одного полного колебания (с). Частота ν = 1/T — число колебаний в секунду (Гц). Амплитуда A — максимальное отклонение тела от положения равновесия.", cat:"Колебания"},
  {q:"Что такое гармонические колебания?", a:"Гармонические колебания — колебания, при которых смещение изменяется по закону синуса или косинуса: x = A·cos(ωt + φ₀), где ω — циклическая частота, φ₀ — начальная фаза.", cat:"Колебания"},
  {q:"Какой ток называется переменным?", a:"Переменный ток — электрический ток, периодически изменяющийся по величине и направлению. В технике чаще всего синусоидальный: i = Iₘ·sin(ωt).", cat:"Колебания"},
  {q:"Что такое механические волны?", a:"Механические волны — распространение колебаний в упругой среде. Волна переносит энергию, но не переносит вещество. Бывают продольные и поперечные.", cat:"Волны"},
  {q:"Дайте определение продольным и поперечным волнам", a:"Продольные волны — колебания частиц происходят вдоль направления распространения волны (звук в газах и жидкостях). Поперечные — колебания перпендикулярны направлению распространения (волны на воде, свет).", cat:"Волны"},
  {q:"Что такое длина волны?", a:"Длина волны λ — расстояние между двумя ближайшими точками, колеблющимися в одной фазе; расстояние, которое волна проходит за один период: λ = vT = v/ν.", cat:"Волны"},
  {q:"Что такое звуковые волны? В каких средах распространяется звуковая волна?", a:"Звуковые волны — механические продольные волны, воспринимаемые ухом человека (20 Гц — 20 кГц). Распространяются в любых упругих средах — газах, жидкостях, твёрдых телах. В вакууме звук не распространяется.", cat:"Волны"},
  {q:"Что такое электромагнитные колебания?", a:"Электромагнитные колебания — периодические изменения заряда, тока, напряжения, напряжённости электрического и магнитного полей в колебательном контуре.", cat:"ЭМ волны"},
  {q:"Что такое колебательный контур?", a:"Колебательный контур — система из катушки индуктивности L и конденсатора C, в которой возникают электромагнитные колебания. Период: T = 2π√(LC) (формула Томсона).", cat:"ЭМ волны"},
  {q:"Что такое электромагнитная волна?", a:"Электромагнитная волна — распространяющееся в пространстве переменное электромагнитное поле. Поперечная волна, не требует среды для распространения, скорость в вакууме c = 3·10⁸ м/с.", cat:"ЭМ волны"},
  {q:"Перечислите виды электромагнитных излучений. В чем их сходство и в чем заключается различие?", a:"Виды (по возрастанию частоты): радиоволны, микроволны, инфракрасное, видимый свет, ультрафиолетовое, рентгеновское, гамма-излучение. Сходство: все распространяются со скоростью света, являются поперечными ЭМ волнами. Различие: частота, длина волны, способ получения и воздействие на вещество.", cat:"ЭМ волны"},
  {q:"Как изменяются длина волны, скорость, период и частота при переходе волны из одной среды в другую?", a:"При переходе из среды в среду: частота ν — не изменяется. Скорость v и длина волны λ — изменяются (λ = v/ν). Период T = 1/ν — не изменяется.", cat:"Волны"},
  {q:"Перечислите волновые свойства света", a:"Волновые свойства света: интерференция, дифракция, дисперсия, поляризация, преломление, отражение. Подтверждают волновую природу света.", cat:"Оптика"},
  {q:"Дайте определение интерференции света. Приведите примеры", a:"Интерференция — сложение когерентных световых волн, при котором в одних точках наблюдается усиление, в других — ослабление интенсивности. Примеры: радужные пятна на мыльных плёнках, плёнка бензина на воде, просветление оптики.", cat:"Оптика"},
  {q:"Дайте определение дифракции света. Приведите примеры", a:"Дифракция — огибание светом препятствий и проникновение в область геометрической тени. Примеры: дифракционная решётка, цветные ореолы вокруг источников света, размытость теней от маленьких источников.", cat:"Оптика"},
  {q:"Дайте определение дисперсии света. Приведите примеры", a:"Дисперсия — зависимость показателя преломления вещества от длины волны (частоты) света, что приводит к разложению белого света в спектр. Примеры: радуга, преломление света в стеклянной призме.", cat:"Оптика"},
  {q:"Что такое линза? Какими бывают линзы?", a:"Линза — прозрачное тело, ограниченное двумя сферическими поверхностями. Выпуклые (собирающие) — утолщены в центре, увеличивают угол сходимости лучей. Вогнутые (рассеивающие) — утончены в центре, увеличивают угол расходимости.", cat:"Оптика"},
  {q:"Сформулируйте закон отражения света", a:"Угол падения равен углу отражения; падающий луч, отражённый луч и нормаль к поверхности в точке падения лежат в одной плоскости.", cat:"Оптика"},
  {q:"Сформулируйте закон преломления света", a:"n₁·sin α = n₂·sin β, где α — угол падения, β — угол преломления, n₁ и n₂ — показатели преломления сред. Падающий луч, преломлённый луч и нормаль — в одной плоскости.", cat:"Оптика"},
  {q:"В каком случае наблюдается явление полного внутреннего отражения света? Приведите пример", a:"Полное внутреннее отражение происходит при переходе света из оптически более плотной в менее плотную среду, когда угол падения превышает критический угол: sin θ꜀ = n₂/n₁. Пример: световод, блеск бриллиантов, призмы в оптических приборах.", cat:"Оптика"},
  {q:"Что такое фотоэффект? Объясните условие возникновения фотоэффекта", a:"Фотоэффект — вырывание электронов из вещества под действием света. Условие: энергия фотона должна быть не меньше работы выхода: hν ≥ A. Красная граница фотоэффекта: ν₀ = A/h.", cat:"Квантовая физика"},
  {q:"Что такое фотон? Перечислите свойства фотонов", a:"Фотон — квант электромагнитного излучения. Свойства: масса покоя равна нулю; движется со скоростью света c; энергия E = hν; импульс p = h/λ; не несёт заряда; поглощается и испускается целиком.", cat:"Квантовая физика"},
  {q:"Что значит «нуклонный состав атомного ядра»?", a:"Ядро атома состоит из нуклонов: протонов (Z — зарядовое число) и нейтронов (N = A − Z). Массовое число A = Z + N — общее число нуклонов. Запись: ᴬ_Z X.", cat:"Ядерная физика"},
  {q:"Объясните, что значит «планетарная модель атома»", a:"Планетарная модель Резерфорда: в центре атома находится маленькое плотное положительно заряженное ядро, вокруг которого по орбитам вращаются электроны — подобно планетам вокруг Солнца.", cat:"Ядерная физика"},
  {q:"Сформулируйте квантовые постулаты Бора", a:"1-й постулат (стационарных состояний): электрон может двигаться только по определённым орбитам, не излучая энергии. 2-й постулат (частот): при переходе с орбиты на орбиту атом испускает или поглощает фотон: hν = E₂ − E₁.", cat:"Ядерная физика"},
  {q:"Что такое радиоактивность?", a:"Радиоактивность — самопроизвольное превращение неустойчивых ядер атомов в другие ядра с испусканием ионизирующего излучения (α-, β-, γ-лучей). Открыта Беккерелем в 1896 г.", cat:"Ядерная физика"},
  {q:"Что собой представляет альфа-распад и бэта-распад?", a:"Альфа-распад: ядро испускает α-частицу (ядро гелия ⁴₂He); Z уменьшается на 2, A на 4. Бета-распад: нейтрон превращается в протон с испусканием электрона (β⁻) и антинейтрино; Z увеличивается на 1, A не меняется.", cat:"Ядерная физика"},
  {q:"Что такое период полураспада?", a:"Период полураспада T₁/₂ — время, за которое распадается половина начального числа радиоактивных ядер. N = N₀·(1/2)^(t/T₁/₂). Не зависит от внешних условий.", cat:"Ядерная физика"},
  {q:"Дайте определение, что такое ядерные силы", a:"Ядерные силы — силы взаимодействия между нуклонами в ядре. Свойства: короткодействующие (≈10⁻¹⁵ м), очень сильные (сильнее электрических), зарядово независимые, не подчиняются закону обратных квадратов.", cat:"Ядерная физика"},
  {q:"Что такое энергия связи атомного ядра?", a:"Энергия связи — энергия, необходимая для полного расщепления ядра на отдельные нуклоны. Eсв = Δm·c², где Δm — дефект масс (разность между суммарной массой нуклонов и массой ядра).", cat:"Ядерная физика"},
  {q:"Какие законы сохранения выполняются при осуществлении ядерных реакций?", a:"При ядерных реакциях выполняются: закон сохранения массового числа A, закон сохранения заряда Z, закон сохранения импульса, закон сохранения энергии (с учётом дефекта масс).", cat:"Ядерная физика"},
];

let cards = ALL_CARDS.map((c,i)=>({...c,id:i,known:false,nextReview:Date.now(),interval:1,ef:2.5}));
let filtered=[...cards],cardIdx=0,flipped=false,activeCategory='all';
let quizQ=[],quizIdx=0,quizScore=0,answered=false,quizSize=20;
let autoTimer=null;
const AUTO_DELAY=2800;

function sm2(card,correct){
  if(correct){card.known=true;card.interval=card.interval<2?card.interval*2+1:Math.round(card.interval*card.ef);card.ef=Math.max(1.3,card.ef+0.1);}
  else{card.known=false;card.interval=1;card.ef=Math.max(1.3,card.ef-0.2);}
  card.nextReview=Date.now()+card.interval*60000;
}

function buildFilters(){
  const cats=['all',...new Set(ALL_CARDS.map(c=>c.cat))];
  document.getElementById('filter-row').innerHTML=cats.map(c=>
    `<button class="filter-tag${c==='all'?' active':''}" onclick="setCategory('${c}')">${c==='all'?'Все темы':c}</button>`
  ).join('');
}

function setCategory(cat){
  activeCategory=cat;
  document.querySelectorAll('.filter-tag').forEach(b=>b.classList.toggle('active',b.textContent===(cat==='all'?'Все темы':cat)));
  filtered=cat==='all'?[...cards]:cards.filter(c=>c.cat===cat);
  cardIdx=0;updateCardDisplay();
}

function updateCardDisplay(){
  flipped=false;
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('rate-btns').style.display='none';
  document.getElementById('flip-btns').style.display='flex';
  if(!filtered.length)return;
  const c=filtered[cardIdx];
  document.getElementById('card-q').textContent=c.q;
  document.getElementById('card-a').textContent=c.a;
  document.getElementById('card-cat').textContent=c.cat;
  const label=`${cardIdx+1} / ${filtered.length}`;
  document.getElementById('card-num').textContent=label;
  document.getElementById('card-num-b').textContent=label;
  document.getElementById('card-progress').style.width=`${((cardIdx+1)/filtered.length)*100}%`;
  document.getElementById('stat-total').textContent=cards.length;
  document.getElementById('stat-known').textContent=cards.filter(c=>c.known).length;
  document.getElementById('stat-due').textContent=cards.filter(c=>!c.known).length;
}

function flipCard(){
  flipped=!flipped;
  document.getElementById('card-inner').classList.toggle('flipped',flipped);
  document.getElementById('rate-btns').style.display=flipped?'flex':'none';
  document.getElementById('flip-btns').style.display=flipped?'none':'flex';
}
function rateCard(correct){sm2(filtered[cardIdx],correct);cardIdx=(cardIdx+1)%filtered.length;updateCardDisplay();}
function nextCard(){cardIdx=(cardIdx+1)%filtered.length;updateCardDisplay();}
function prevCard(){cardIdx=(cardIdx-1+filtered.length)%filtered.length;updateCardDisplay();}

function setQuizSize(n){
  quizSize=n;
  document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('sz-'+n).classList.add('active');
  document.getElementById('quiz-badge').textContent=n;
  if(document.getElementById('quiz-area').style.display!=='none') resetQuiz();
}

function shuffleArr(a){return[...a].sort(()=>Math.random()-0.5);}

function startQuiz(){
  const pool=shuffleArr(ALL_CARDS).slice(0,quizSize);
  quizQ=pool.map(q=>{
    const wrong=shuffleArr(ALL_CARDS.filter(c=>c!==q)).slice(0,3).map(c=>c.a);
    return{q:q.q,correct:q.a,options:shuffleArr([q.a,...wrong]),chosen:null,chosenIdx:null};
  });
  quizIdx=0;quizScore=0;answered=false;
  document.getElementById('quiz-start').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('quiz-results').style.display='none';
  renderQuestion();
}

function renderQuestion(){
  clearAutoTimer();
  const q=quizQ[quizIdx];
  document.getElementById('q-counter').textContent=`Вопрос ${quizIdx+1} / ${quizQ.length}`;
  document.getElementById('q-score').textContent=`✦ ${quizScore}`;
  document.getElementById('quiz-progress').style.width=`${(quizIdx/quizQ.length)*100}%`;
  document.getElementById('q-num-badge').textContent=String(quizIdx+1).padStart(2,'0');
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('prev-btn').style.display=quizIdx>0?'inline-block':'none';
  const letters=['А','Б','В','Г'];
  document.getElementById('q-options').innerHTML=q.options.map((o,i)=>
    `<button class="option-btn" onclick="selectOption(this,${i})"><span class="opt-letter">${letters[i]}</span><span>${o}</span></button>`
  ).join('');
  if(q.chosen!==null){
    answered=true;
    const btns=document.querySelectorAll('.option-btn');
    btns.forEach(b=>{b.disabled=true;if(b.querySelector('span:last-child').textContent===q.correct)b.classList.add('correct');});
    if(q.chosen!==q.correct)btns[q.chosenIdx].classList.add('wrong');
    const fb=document.getElementById('q-feedback');
    fb.textContent=q.chosen===q.correct?'✓ Правильно!':'✗ Неверно. Правильный ответ: '+q.correct;
    fb.className='feedback-msg show '+(q.chosen===q.correct?'ok':'fail');
    document.getElementById('next-btn').style.display=quizIdx<quizQ.length-1?'inline-block':'none';
  } else {
    answered=false;
    document.getElementById('q-feedback').className='feedback-msg';
    document.getElementById('next-btn').style.display='none';
  }
}

function selectOption(btn,idx){
  if(answered)return;
  answered=true;
  const q=quizQ[quizIdx];
  const chosen=q.options[idx];
  q.chosen=chosen;q.chosenIdx=idx;
  document.querySelectorAll('.option-btn').forEach(b=>{
    b.disabled=true;
    if(b.querySelector('span:last-child').textContent===q.correct)b.classList.add('correct');
  });
  const fb=document.getElementById('q-feedback');
  if(chosen===q.correct){quizScore++;btn.classList.add('correct');fb.textContent='✓ Правильно!';fb.className='feedback-msg show ok';}
  else{btn.classList.add('wrong');fb.textContent='✗ Неверно. Правильный ответ: '+q.correct;fb.className='feedback-msg show fail';}
  document.getElementById('q-score').textContent=`✦ ${quizScore}`;
  document.getElementById('next-btn').style.display='inline-block';
  startAutoTimer();
}

function startAutoTimer(){
  clearAutoTimer();
  const bar=document.getElementById('auto-timer-bar');
  const fill=document.getElementById('auto-timer-fill');
  const label=document.getElementById('q-timer-label');
  bar.classList.add('visible');
  fill.style.transition='none';fill.style.transform='scaleX(1)';
  fill.getBoundingClientRect();
  fill.style.transition=`transform ${AUTO_DELAY}ms linear`;fill.style.transform='scaleX(0)';
  let remaining=Math.ceil(AUTO_DELAY/1000);
  label.textContent=`Следующий через ${remaining} с...`;
  const ticker=setInterval(()=>{remaining--;if(remaining>0)label.textContent=`Следующий через ${remaining} с...`;},1000);
  autoTimer=setTimeout(()=>{clearInterval(ticker);nextQuestion();},AUTO_DELAY);
  autoTimer._ticker=ticker;
}

function clearAutoTimer(){
  if(autoTimer){clearTimeout(autoTimer);if(autoTimer._ticker)clearInterval(autoTimer._ticker);autoTimer=null;}
  const bar=document.getElementById('auto-timer-bar');
  const label=document.getElementById('q-timer-label');
  if(bar)bar.classList.remove('visible');
  if(label)label.textContent='';
}

function skipToNext(){clearAutoTimer();nextQuestion();}

function nextQuestion(){
  clearAutoTimer();quizIdx++;
  if(quizIdx>=quizQ.length)showResults();else renderQuestion();
}

function prevQuestion(){
  if(quizIdx<=0)return;
  clearAutoTimer();
  const cur=quizQ[quizIdx];
  if(cur&&cur.chosen===cur.correct)quizScore--;
  if(cur){cur.chosen=null;cur.chosenIdx=null;}
  quizIdx--;renderQuestion();
}

function showResults(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('quiz-results').style.display='block';
  const pct=Math.round((quizScore/quizQ.length)*100);
  document.getElementById('res-score').textContent=quizScore;
  document.getElementById('res-denom').textContent=`из ${quizQ.length}`;
  const labels=['Попробуйте ещё раз 📖','Неплохое начало!','Хороший результат ✨','Отличная работа! 🌟','Превосходно! Настоящий знаток! 🏆'];
  document.getElementById('res-label').textContent=labels[Math.min(Math.floor(pct/21),4)];
  setTimeout(()=>{document.getElementById('res-fill').style.width=pct+'%';},100);
}

function resetQuiz(){
  clearAutoTimer();
  quizQ=[];quizIdx=0;quizScore=0;answered=false;
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('quiz-results').style.display='none';
  document.getElementById('quiz-start').style.display='block';
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['cards','quiz'][i]===tab));
  document.getElementById('view-cards').classList.toggle('active',tab==='cards');
  document.getElementById('view-quiz').classList.toggle('active',tab==='quiz');
}

buildFilters();
updateCardDisplay();
</script>
</body>
</html>
